<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Escape</title>

  <style>
    :root {
      --bg: #070b1d;
      --bg2: #0d1330;
      --panel: rgba(18, 25, 57, 0.88);
      --cyan: #22d3ee;
      --purple: #a855f7;
      --pink: #ec4899;
      --danger: #fb7185;
      --success: #34d399;
      --warning: #fbbf24;
      --text: #f8fafc;
      --muted: #a5b4fc;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.24), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(34, 211, 238, 0.18), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(236, 72, 153, 0.13), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg2) 62%, #090d22);
    }

    button {
      font: inherit;
      color: inherit;
    }

    .app {
      min-height: 100svh;
      position: relative;
      isolation: isolate;
    }

    .orb {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(35px);
      opacity: 0.22;
      pointer-events: none;
      z-index: -1;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb-one {
      left: -80px;
      top: 12%;
      background: var(--purple);
    }

    .orb-two {
      right: -90px;
      bottom: 8%;
      background: var(--cyan);
      animation-delay: -5s;
    }

    @keyframes drift {
      from { transform: translate3d(0, -18px, 0) scale(1); }
      to { transform: translate3d(28px, 24px, 0) scale(1.12); }
    }

    .screen {
      display: none;
      min-height: 100svh;
      width: 100%;
      padding: clamp(16px, 3vw, 34px);
    }

    .screen.active {
      display: flex;
    }

    /* MAIN MENU */

    #menuScreen {
      align-items: center;
      justify-content: center;
    }

    .menu-card,
    .modal-card {
      background: linear-gradient(
        155deg,
        rgba(30, 41, 82, 0.94),
        rgba(12, 18, 44, 0.94)
      );
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }

    .menu-card {
      width: min(94vw, 620px);
      padding: clamp(28px, 5vw, 54px);
      text-align: center;
      border-radius: 34px;
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(34, 211, 238, 0.16),
        transparent,
        rgba(168, 85, 247, 0.16),
        transparent
      );
      pointer-events: none;
    }

    .logo-mark {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      color: white;
      font-size: 2.7rem;
      font-weight: 900;
      background: linear-gradient(145deg, var(--purple), var(--cyan));
      box-shadow:
        0 18px 45px rgba(34, 211, 238, 0.22),
        0 10px 30px rgba(168, 85, 247, 0.22);
      animation: logoFloat 3.2s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    .game-title {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6.4rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff, #a5f3fc 45%, #d8b4fe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 35px rgba(34, 211, 238, 0.16);
    }

    .tagline {
      margin: 14px auto 30px;
      max-width: 430px;
      color: var(--muted);
      font-size: clamp(1rem, 2.8vw, 1.12rem);
      line-height: 1.55;
    }

    .menu-actions {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      min-height: 52px;
      padding: 0 28px;
      font-weight: 800;
      letter-spacing: 0.02em;
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      user-select: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(34, 211, 238, 0.55);
      outline-offset: 3px;
    }

    .btn-primary {
      min-width: min(100%, 260px);
      color: #06111f;
      background: linear-gradient(135deg, var(--cyan), #67e8f9 45%, var(--purple));
      box-shadow:
        0 14px 34px rgba(34, 211, 238, 0.23),
        0 10px 26px rgba(168, 85, 247, 0.2);
    }

    .btn-secondary {
      min-width: min(100%, 260px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.24);
    }

    .session-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .stat-tile {
      padding: 15px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .stat-label,
    .result-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 5px;
      font-size: 1.35rem;
      font-weight: 900;
    }

    /* GAME SCREEN */

    #gameScreen {
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2vw, 18px);
    }

    .game-shell {
      width: min(96vw, 900px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .hud {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(10, 16, 40, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.15);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(16px);
    }

    .hud-left,
    .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      transition: transform 150ms ease, background 150ms ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.11);
    }

    .icon-btn:focus-visible {
      outline: 3px solid rgba(34, 211, 238, 0.5);
      outline-offset: 2px;
    }

    .level-pill {
      display: grid;
      text-align: center;
      min-width: 108px;
    }

    .level-number {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .difficulty {
      margin-top: 2px;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .difficulty.easy { color: var(--success); }
    .difficulty.moderate { color: var(--cyan); }
    .difficulty.hard { color: var(--warning); }
    .difficulty.expert { color: var(--danger); }

    .score-box {
      padding: 8px 13px;
      border-radius: 15px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.2);
      font-weight: 900;
      white-space: nowrap;
    }

    .hearts {
      display: flex;
      gap: 3px;
      font-size: 1.28rem;
    }

    .heart {
      filter: drop-shadow(0 4px 10px rgba(236, 72, 153, 0.22));
      transition: transform 180ms ease, opacity 180ms ease, filter 180ms ease;
    }

    .heart.lost {
      opacity: 0.22;
      filter: grayscale(1);
      transform: scale(0.82);
    }

    .progress-area {
      width: 100%;
      max-width: 720px;
      display: grid;
      gap: 7px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
      transition: width 260ms ease;
    }

    .board-frame {
      padding: clamp(8px, 1.6vw, 14px);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.025));
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: var(--shadow);
    }

    .board {
      display: grid;
      gap: clamp(4px, 0.9vw, 8px);
      width: min(92vw, 650px, calc(100svh - 245px));
      min-width: min(92vw, 300px);
      padding: clamp(6px, 1vw, 10px);
      border-radius: 22px;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        rgba(5, 10, 27, 0.72);
      background-size: 24px 24px;
      border: 1px solid rgba(34, 211, 238, 0.13);
    }

    .cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: clamp(8px, 1.5vw, 15px);
      background: rgba(255, 255, 255, 0.035);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .arrow {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: inherit;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: clamp(1.15rem, 5.4vmin, 2.25rem);
      line-height: 1;
      font-weight: 900;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
      background: linear-gradient(145deg, rgba(34, 211, 238, 0.9), rgba(14, 116, 144, 0.92));
      box-shadow:
        0 8px 20px rgba(34, 211, 238, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.3),
        inset 0 -4px 8px rgba(0,0,0,0.18);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      user-select: none;
      touch-action: manipulation;
    }

    .arrow:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.09);
    }

    .arrow:active {
      transform: scale(0.94);
    }

    .arrow:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.72);
      outline-offset: 2px;
    }

    .arrow.dir-up {
      background: linear-gradient(145deg, #22d3ee, #0e7490);
    }

    .arrow.dir-right {
      background: linear-gradient(145deg, #a855f7, #6d28d9);
    }

    .arrow.dir-down {
      background: linear-gradient(145deg, #ec4899, #be185d);
    }

    .arrow.dir-left {
      background: linear-gradient(145deg, #38bdf8, #1d4ed8);
    }

    .arrow.removing {
      pointer-events: none;
      animation: flyOut 260ms ease-in forwards;
    }

    @keyframes flyOut {
      45% {
        opacity: 1;
        filter: brightness(1.3);
      }
      100% {
        opacity: 0;
        transform:
          translate(var(--exit-x), var(--exit-y))
          scale(0.45)
          rotate(10deg);
      }
    }

    .arrow.blocked {
      pointer-events: none;
      animation: shake 360ms ease-in-out;
      box-shadow:
        0 0 0 3px rgba(251, 113, 133, 0.55),
        0 10px 25px rgba(251, 113, 133, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.28);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-6px) rotate(-4deg); }
      36% { transform: translateX(6px) rotate(4deg); }
      54% { transform: translateX(-5px) rotate(-3deg); }
      72% { transform: translateX(5px) rotate(3deg); }
      88% { transform: translateX(-2px); }
    }

    .live-message {
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
    }

    /* MODALS */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(3, 7, 18, 0.72);
      backdrop-filter: blur(10px);
    }

    .modal.hidden {
      display: none;
    }

    .modal-card {
      width: min(94vw, 520px);
      max-height: calc(100svh - 36px);
      overflow: auto;
      padding: clamp(24px, 5vw, 38px);
      text-align: center;
      border-radius: 30px;
      animation: popIn 220ms ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      font-size: 2.25rem;
      background: linear-gradient(
        145deg,
        rgba(34, 211, 238, 0.22),
        rgba(168, 85, 247, 0.22)
      );
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: clamp(2rem, 8vw, 3.25rem);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, #fff, #a5f3fc, #d8b4fe);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-title.danger {
      background: linear-gradient(90deg, #fff, #fecdd3, #fda4af);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .modal-subtitle {
      margin: 0 auto 20px;
      max-width: 380px;
      color: var(--muted);
      line-height: 1.5;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .result-item {
      padding: 13px 8px;
      border-radius: 16px;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(148,163,184,0.13);
    }

    .result-value {
      display: block;
      margin-top: 5px;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .bonus-line {
      margin: 10px 0 0;
      color: var(--success);
      font-weight: 900;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    .how-list {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
      display: grid;
      gap: 12px;
      color: #dbeafe;
      line-height: 1.45;
    }

    .how-list li {
      padding: 12px 14px;
      border-radius: 15px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(148,163,184,0.12);
    }

    .how-list strong {
      color: #fff;
    }

    @media (max-width: 620px) {
      .screen {
        padding: 12px;
      }

      .hud {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 9px;
        padding: 10px;
      }

      .hud-left,
      .hud-right {
        width: 100%;
        justify-content: center;
      }

      .board {
        width: min(94vw, calc(100svh - 315px));
        min-width: min(94vw, 285px);
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .modal-actions {
        display: grid;
      }

      .modal-actions .btn {
        width: 100%;
      }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      .hud {
        grid-template-columns: auto 1fr auto;
        padding: 8px 10px;
      }

      .board {
        width: min(58vw, calc(100svh - 180px));
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .hearts {
        font-size: 1.1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <section id="menuScreen" class="screen active" aria-labelledby="menuTitle">
      <div class="menu-card">
        <div class="logo-mark" aria-hidden="true">↗</div>
        <h1 id="menuTitle" class="game-title">Arrow<br />Escape</h1>
        <p class="tagline">
          Clear every arrow by sending it out of the board. One blocked path
          costs a life — plan every move!
        </p>

        <div class="menu-actions">
          <button id="playBtn" class="btn btn-primary" type="button">▶ Play Game</button>
          <button id="howBtn" class="btn btn-secondary" type="button">? How to Play</button>
        </div>

        <div class="session-stats" aria-label="Current session statistics">
          <div class="stat-tile">
            <span class="stat-label">Best Score</span>
            <span id="menuBestScore" class="stat-value">0</span>
          </div>
          <div class="stat-tile">
            <span class="stat-label">Unlocked Level</span>
            <span id="menuUnlockedLevel" class="stat-value">1 / 30</span>
          </div>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen" aria-labelledby="levelText">
      <div class="game-shell">
        <div class="hud">
          <div class="hud-left">
            <button id="homeBtn" class="icon-btn" type="button" aria-label="Return to main menu">⌂</button>
            <div class="level-pill">
              <span id="levelText" class="level-number">Level 1</span>
              <span id="difficultyText" class="difficulty easy">Easy</span>
            </div>
          </div>

          <div class="hud-right">
            <div id="scoreBox" class="score-box" aria-label="Current score">Score 0</div>
            <div id="hearts" class="hearts" aria-label="Lives remaining"></div>
          </div>
        </div>

        <div class="progress-area">
          <div class="progress-meta">
            <span>Puzzle Progress</span>
            <span id="progressText">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <div class="board-frame">
          <div id="board" class="board" role="grid" aria-label="Arrow puzzle board"></div>
        </div>

        <div id="liveMessage" class="live-message" aria-live="polite"></div>
      </div>
    </section>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalCard" class="modal-card"></div>
    </div>
  </div>

  <script>
    "use strict";

    /* =========================
       LEVEL CONFIGURATION
       ========================= */

    const LEVELS = [
      { rows: 5, cols: 5, arrows: 4,  difficulty: "EASY" },
      { rows: 5, cols: 5, arrows: 6,  difficulty: "EASY" },
      { rows: 5, cols: 5, arrows: 8,  difficulty: "EASY" },
      { rows: 5, cols: 5, arrows: 9,  difficulty: "EASY" },
      { rows: 5, cols: 5, arrows: 10, difficulty: "EASY" },

      { rows: 6, cols: 6, arrows: 12, difficulty: "MODERATE" },
      { rows: 6, cols: 6, arrows: 14, difficulty: "MODERATE" },
      { rows: 6, cols: 6, arrows: 16, difficulty: "MODERATE" },
      { rows: 6, cols: 6, arrows: 18, difficulty: "MODERATE" },
      { rows: 6, cols: 6, arrows: 20, difficulty: "MODERATE" },

      { rows: 7, cols: 7, arrows: 22, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 24, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 26, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 28, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 30, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 31, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 32, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 33, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 34, difficulty: "HARD" },
      { rows: 7, cols: 7, arrows: 35, difficulty: "HARD" },

      { rows: 8, cols: 8, arrows: 34, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 35, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 36, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 37, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 38, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 39, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 40, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 41, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 42, difficulty: "EXPERT" },
      { rows: 8, cols: 8, arrows: 43, difficulty: "EXPERT" }
    ];

    const DIRECTIONS = {
      up: {
        dr: -1,
        dc: 0,
        symbol: "↑",
        name: "up",
        exitX: "0",
        exitY: "-120%"
      },
      right: {
        dr: 0,
        dc: 1,
        symbol: "→",
        name: "right",
        exitX: "120%",
        exitY: "0"
      },
      down: {
        dr: 1,
        dc: 0,
        symbol: "↓",
        name: "down",
        exitX: "0",
        exitY: "120%"
      },
      left: {
        dr: 0,
        dc: -1,
        symbol: "←",
        name: "left",
        exitX: "-120%",
        exitY: "0"
      }
    };

    const MOVE_POINTS = 10;
    const LIFE_BONUS = 75;
    const CLEAR_BONUS = 100;

    /* =========================
       SESSION STATE
       ========================= */

    let score = 0;
    let levelStartScore = 0;
    let bestScore = 0;
    let unlockedLevel = 1;

    let levelIndex = 0;
    let levelConfig = LEVELS[0];
    let arrows = [];
    let totalArrows = 0;

    let lives = 3;
    let gameActive = false;
    let inputLocked = false;

    const $ = id => document.getElementById(id);

    const menuScreen = $("menuScreen");
    const gameScreen = $("gameScreen");
    const playBtn = $("playBtn");
    const howBtn = $("howBtn");
    const homeBtn = $("homeBtn");
    const board = $("board");
    const levelText = $("levelText");
    const difficultyText = $("difficultyText");
    const scoreBox = $("scoreBox");
    const hearts = $("hearts");
    const progressFill = $("progressFill");
    const progressText = $("progressText");
    const liveMessage = $("liveMessage");
    const modal = $("modal");
    const modalCard = $("modalCard");
    const menuBestScore = $("menuBestScore");
    const menuUnlockedLevel = $("menuUnlockedLevel");

    /* =========================
       UTILITY FUNCTIONS
       ========================= */

    function randomInt(max) {
      return Math.floor(Math.random() * max);
    }

    function shuffle(items) {
      const copy = [...items];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function key(row, col) {
      return `${row},${col}`;
    }

    function showScreen(screenName) {
      menuScreen.classList.toggle("active", screenName === "menu");
      gameScreen.classList.toggle("active", screenName === "game");
    }

    function updateMenuStats() {
      menuBestScore.textContent = bestScore.toLocaleString();
      menuUnlockedLevel.textContent = `${unlockedLevel} / ${LEVELS.length}`;
    }

    function setMessage(message) {
      liveMessage.textContent = message;
    }

    /* =========================
       SOLVABLE PUZZLE GENERATOR

       Arrows are placed in reverse solution order. Each newly placed arrow
       must have a clear exit path through arrows that will remain after it
       is removed. This guarantees at least one complete solution.
       ========================= */

    function pathIsClearForList(list, arrow, config) {
      const direction = DIRECTIONS[arrow.dir];
      let row = arrow.row + direction.dr;
      let col = arrow.col + direction.dc;

      while (
        row >= 0 &&
        row < config.rows &&
        col >= 0 &&
        col < config.cols
      ) {
        const blocker = list.find(
          item => !item.removed && item.row === row && item.col === col
        );

        if (blocker) return false;

        row += direction.dr;
        col += direction.dc;
      }

      return true;
    }

    function generateRandomPuzzle(config) {
      const placed = [];
      const usedCells = new Set();

      for (let i = 0; i < config.arrows; i++) {
        let found = false;

        for (let attempt = 0; attempt < 5000 && !found; attempt++) {
          const row = randomInt(config.rows);
          const col = randomInt(config.cols);

          if (usedCells.has(key(row, col))) continue;

          const directions = shuffle(Object.keys(DIRECTIONS));

          for (const dir of directions) {
            const candidate = {
              id: i,
              row,
              col,
              dir,
              removed: false
            };

            if (pathIsClearForList(placed, candidate, config)) {
              placed.push(candidate);
              usedCells.add(key(row, col));
              found = true;
              break;
            }
          }
        }

        if (!found) return null;
      }

      return placed;
    }

    function verifySolutionOrder(list, config) {
      const testArrows = list.map(arrow => ({ ...arrow }));

      // The generated list is reverse solution order.
      for (let i = testArrows.length - 1; i >= 0; i--) {
        const arrow = testArrows[i];

        if (!pathIsClearForList(testArrows, arrow, config)) {
          return false;
        }

        arrow.removed = true;
      }

      return true;
    }

    function generateFallbackPuzzle(config) {
      const fallback = [];
      let id = 0;

      for (let row = 0; row < config.rows && fallback.length < config.arrows; row++) {
        const dir = randomInt(2) === 0 ? "right" : "left";

        const columns = Array.from({ length: config.cols }, (_, col) => col);
        if (dir === "left") columns.reverse();

        for (const col of columns) {
          if (fallback.length >= config.arrows) break;

          fallback.push({
            id: id++,
            row,
            col,
            dir,
            removed: false
          });
        }
      }

      return fallback;
    }

    function generateValidatedPuzzle(config) {
      for (let attempt = 0; attempt < 50; attempt++) {
        const generated = generateRandomPuzzle(config);

        if (
          generated &&
          verifySolutionOrder(generated, config)
        ) {
          return generated;
        }
      }

      /*
       * Safety net:
       * Every arrow in a row points the same horizontal direction.
       * Each row can therefore be cleared inward from its open edge.
       */
      return generateFallbackPuzzle(config);
    }

    /* =========================
       LEVEL INITIALIZATION
       ========================= */

    function startLevel(index) {
      levelIndex = index;
      levelConfig = LEVELS[index];

      levelStartScore = score;
      lives = 3;
      gameActive = true;
      inputLocked = false;

      arrows = generateValidatedPuzzle(levelConfig);
      totalArrows = arrows.length;

      showScreen("game");
      renderBoard();
      updateHUD();
      updateProgress();
      setMessage("Click an arrow whose path to the edge is clear.");
    }

    function renderBoard() {
      board.innerHTML = "";
      board.style.gridTemplateColumns = `repeat(${levelConfig.cols}, minmax(0, 1fr))`;

      const arrowMap = new Map(
        arrows.map(arrow => [key(arrow.row, arrow.col), arrow])
      );

      for (let row = 0; row < levelConfig.rows; row++) {
        for (let col = 0; col < levelConfig.cols; col++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("role", "presentation");

          const arrow = arrowMap.get(key(row, col));

          if (arrow) {
            const direction = DIRECTIONS[arrow.dir];
            const button = document.createElement("button");

            button.type = "button";
            button.className = `arrow dir-${arrow.dir}`;
            button.textContent = direction.symbol;
            button.dataset.arrowId = arrow.id;
            button.setAttribute(
              "aria-label",
              `Arrow pointing ${direction.name}`
            );
            button.style.setProperty("--exit-x", direction.exitX);
            button.style.setProperty("--exit-y", direction.exitY);

            arrow.element = button;
            cell.appendChild(button);
          }

          board.appendChild(cell);
        }
      }
    }

    function updateHUD() {
      levelText.textContent = `Level ${levelIndex + 1}`;
      difficultyText.textContent = levelConfig.difficulty;
      difficultyText.className =
        `difficulty ${levelConfig.difficulty.toLowerCase()}`;

      scoreBox.textContent = `Score ${score.toLocaleString()}`;

      hearts.innerHTML = "";

      for (let i = 0; i < 3; i++) {
        const heart = document.createElement("span");
        heart.className = `heart${i < lives ? "" : " lost"}`;
        heart.textContent = "♥";
        heart.setAttribute("aria-hidden", "true");
        hearts.appendChild(heart);
      }

      hearts.setAttribute("aria-label", `${lives} lives remaining`);
    }

    function updateProgress() {
      const removed = arrows.filter(arrow => arrow.removed).length;
      const percentage =
        totalArrows === 0 ? 0 : Math.round((removed / totalArrows) * 100);

      progressFill.style.width = `${percentage}%`;
      progressText.textContent = `${percentage}%`;
    }

    function remainingCount() {
      return arrows.filter(arrow => !arrow.removed).length;
    }

    /* =========================
       GAME MOVES
       ========================= */

    function livePathIsClear(arrow) {
      const direction = DIRECTIONS[arrow.dir];
      let row = arrow.row + direction.dr;
      let col = arrow.col + direction.dc;

      while (
        row >= 0 &&
        row < levelConfig.rows &&
        col >= 0 &&
        col < levelConfig.cols
      ) {
        const blocker = arrows.find(
          item => !item.removed && item.row === row && item.col === col
        );

        if (blocker) return false;

        row += direction.dr;
        col += direction.dc;
      }

      return true;
    }

    function handleArrowClick(event) {
      const button = event.target.closest(".arrow");

      if (!button || !gameActive || inputLocked) return;

      const arrow = arrows.find(
        item => item.id === Number(button.dataset.arrowId)
      );

      if (!arrow || arrow.removed) return;

      if (livePathIsClear(arrow)) {
        makeValidMove(arrow);
      } else {
        makeInvalidMove(arrow);
      }
    }

    function makeValidMove(arrow) {
      inputLocked = true;
      arrow.removed = true;
      arrow.element.classList.add("removing");

      score += MOVE_POINTS;
      bestScore = Math.max(bestScore, score);

      updateHUD();
      updateProgress();
      setMessage(`+${MOVE_POINTS} points — clean escape!`);

      setTimeout(() => {
        if (arrow.element && arrow.element.parentNode) {
          arrow.element.parentNode.removeChild(arrow.element);
        }

        if (remainingCount() === 0) {
          completeLevel();
        } else if (gameActive) {
          inputLocked = false;
        }
      }, 270);
    }

    function makeInvalidMove(arrow) {
      /*
       * The board remains locked during the shake animation. This prevents
       * extra clicks from costing multiple lives for the same move.
       */
      inputLocked = true;
      lives -= 1;

      updateHUD();
      setMessage("Blocked path! You lost one life.");
      arrow.element.classList.add("blocked");

      setTimeout(() => {
        arrow.element.classList.remove("blocked");

        if (lives <= 0) {
          showGameOver();
        } else {
          inputLocked = false;
        }
      }, 380);
    }

    /* =========================
       LEVEL RESULTS
       ========================= */

    function completeLevel() {
      gameActive = false;
      inputLocked = false;

      const lifeBonus = lives * LIFE_BONUS;
      const clearBonus = CLEAR_BONUS + levelIndex * 10;
      const totalBonus = lifeBonus + clearBonus;

      score += totalBonus;
      bestScore = Math.max(bestScore, score);

      unlockedLevel = Math.max(
        unlockedLevel,
        Math.min(LEVELS.length, levelIndex + 2)
      );

      updateHUD();
      updateProgress();
      updateMenuStats();
      setMessage("Level complete!");

      const isFinalLevel = levelIndex === LEVELS.length - 1;
      const title = isFinalLevel ? "Puzzle Master!" : "Level Complete!";
      const subtitle = isFinalLevel
        ? "You cleared all 30 levels and conquered Arrow Escape."
        : `Level ${levelIndex + 2} is now unlocked.`;

      const primaryAction = isFinalLevel
        ? `<button class="btn btn-primary" type="button" data-action="play-again">Play Again</button>`
        : `<button class="btn btn-primary" type="button" data-action="continue">Continue</button>`;

      showModal(`
        <div class="modal-icon" aria-hidden="true">🏆</div>
        <h2 id="modalTitle" class="modal-title">${title}</h2>
        <p class="modal-subtitle">${subtitle}</p>

        <div class="result-grid">
          <div class="result-item">
            <span class="result-label">Score</span>
            <span class="result-value">${score.toLocaleString()}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Lives Left</span>
            <span class="result-value">
              ${lives > 0 ? "♥".repeat(lives) : "0"}
            </span>
          </div>
          <div class="result-item">
            <span class="result-label">Bonus</span>
            <span class="result-value">+${totalBonus.toLocaleString()}</span>
          </div>
        </div>

        <p class="bonus-line">
          Life bonus: +${lifeBonus} &nbsp;•&nbsp;
          Clear bonus: +${clearBonus}
        </p>

        <div class="modal-actions">
          ${primaryAction}
          <button class="btn btn-secondary" type="button" data-action="menu">
            Main Menu
          </button>
        </div>
      `);
    }

    function showGameOver() {
      gameActive = false;
      inputLocked = false;
      setMessage("Game over. Try the level again!");

      showModal(`
        <div class="modal-icon" aria-hidden="true">💔</div>
        <h2 id="modalTitle" class="modal-title danger">Game Over</h2>
        <p class="modal-subtitle">
          All three lives were used. Retry this level with a fresh set of hearts.
        </p>

        <div class="result-grid">
          <div class="result-item">
            <span class="result-label">Level</span>
            <span class="result-value">${levelIndex + 1}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Difficulty</span>
            <span class="result-value">${levelConfig.difficulty}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Score</span>
            <span class="result-value">${score.toLocaleString()}</span>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-primary" type="button" data-action="retry">
            Retry Level
          </button>
          <button class="btn btn-secondary" type="button" data-action="menu">
            Main Menu
          </button>
        </div>
      `);
    }

    function showHowToPlay() {
      showModal(`
        <div class="modal-icon" aria-hidden="true">↔</div>
        <h2 id="modalTitle" class="modal-title">How to Play</h2>
        <p class="modal-subtitle">
          Remove every arrow from the board before your three hearts run out.
        </p>

        <ul class="how-list">
          <li><strong>Click an arrow</strong> to send it out of the board.</li>
          <li>
            The path in the arrow's pointing direction must be completely
            clear.
          </li>
          <li>
            A blocked arrow shakes, stays on the board, and costs
            <strong>one life</strong>.
          </li>
          <li>Valid moves are worth <strong>+10 points</strong>.</li>
          <li>
            Finish with more lives to earn a bigger completion bonus.
          </li>
        </ul>

        <div class="modal-actions">
          <button class="btn btn-primary" type="button" data-action="close">
            Got It
          </button>
        </div>
      `);
    }

    function showModal(html) {
      modalCard.innerHTML = html;
      modal.classList.remove("hidden");

      const firstButton = modalCard.querySelector("button");
      if (firstButton) {
        firstButton.focus({ preventScroll: true });
      }
    }

    function closeModal() {
      modal.classList.add("hidden");
      modalCard.innerHTML = "";
    }

    function returnToMenu() {
      gameActive = false;
      inputLocked = false;
      closeModal();
      updateMenuStats();
      showScreen("menu");
    }

    /* =========================
       EVENT HANDLERS
       ========================= */

    playBtn.addEventListener("click", () => {
      score = 0;
      closeModal();
      startLevel(unlockedLevel - 1);
    });

    howBtn.addEventListener("click", showHowToPlay);
    homeBtn.addEventListener("click", returnToMenu);
    board.addEventListener("click", handleArrowClick);

    modal.addEventListener("click", event => {
      if (event.target === modal) return;

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;

      const action = actionButton.dataset.action;

      if (action === "close") {
        closeModal();
      } else if (action === "continue") {
        closeModal();
        startLevel(levelIndex + 1);
      } else if (action === "retry") {
        closeModal();
        score = levelStartScore;
        startLevel(levelIndex);
      } else if (action === "menu") {
        returnToMenu();
      } else if (action === "play-again") {
        closeModal();
        score = 0;
        startLevel(0);
      }
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        !modal.classList.contains("hidden") &&
        modal.querySelector('[data-action="close"]')
      ) {
        closeModal();
      }
    });

    updateMenuStats();
    showScreen("menu");
  </script>
</body>
</html>
